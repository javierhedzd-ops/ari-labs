<style>
  :root{
    --hielo-200:#def6fd;
    --hielo-300:#c3eaf7;
    --hielo-400:#9ed8ee;

    --papel:#fbfcfd;

  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;justify-content:center;
    background:var(--noche);color:var(--papel);
    background-image:radial-gradient(120% 80% at 50% 0%, #0e2230 0%, #0b1a21 45%, #060d12 100%);
    font-family:"Newsreader",Georgia,serif;
    -webkit-font-smoothing:antialiased;
    padding:12vh var(--margen) 6vh;
  }
  main{max-width:34rem}
  h1{
    font-weight:300;font-size:clamp(3.4rem,17vw,7rem);
    line-height:.9;letter-spacing:-.045em;margin:0;
  }
  .lema{
    font-family:"Inter",sans-serif;font-size:.8rem;letter-spacing:.06em;
    color:var(--hielo-400);margin:1.6rem 0 0;line-height:1.6;
  }
  .aviso{
    font-family:"Inter",sans-serif;font-size:1.05rem;line-height:1.7;
    color:rgba(222,246,253,.78);margin:3rem 0 0;max-width:30ch;
  }
  .correo{
    display:inline-block;margin-top:1.4rem;
    font-family:"Inter",sans-serif;font-size:.95rem;font-weight:500;
    color:var(--hielo-200);text-decoration:none;overflow-wrap:anywhere;
    border-bottom:1px solid rgba(158,216,238,.35);padding-bottom:.2rem;
  }
  .correo:hover{color:var(--papel);border-color:var(--hielo-300)}
  a:focus-visible{outline:2px solid var(--hielo-300);outline-offset:4px}
  footer{
    margin-top:auto;padding-top:10vh;
    font-family:"Inter",sans-serif;font-size:.72rem;color:rgba(222,246,253,.6);
  }
  footer nav{display:flex;gap:1.4rem;margin-top:.9rem}
  footer a{
    color:rgba(222,246,253,.7);text-decoration:none;
    border-bottom:1px solid rgba(158,216,238,.18);padding-bottom:.1rem;
  }
  footer a:hover{color:var(--hielo-300)}
</style>
