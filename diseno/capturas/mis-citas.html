<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<title>Mis citas · pantallas para la web</title>
<!-- Pantallas de Mis citas dibujadas con el acabado de Ari Labs (su color: olivo profundo).
     Se abren con ?p=claro, ?p=oscuro o ?p=detalle y se fotografían a 360x760 con escala 1.5 (540x1140).
     Regenerar: node diseno/capturas/sacar.js (ver ese archivo). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#eef1ea; --fondo2:#fafbf8; --tinta:#1e2418; --suave:#5a6352; --linea:rgba(255,255,255,.8);
    --vidrio:rgba(255,255,255,.55); --vidrio2:rgba(255,255,255,.3);
    --esmeralda:#4f6236; --esmeralda2:#9db67a; --noche:#262d1f; --chip:rgba(79,98,54,.12); --chip-t:#3f4f2a;
    --alerta:rgba(214,140,40,.14); --alerta-t:#8a5310; --sombra:0 18px 40px -26px rgba(30,36,24,.45);
  }
  .oscuro{
    --fondo:#0f120c; --fondo2:#171b13; --tinta:#eef1ea; --suave:#a7ae9c; --linea:rgba(255,255,255,.12);
    --vidrio:rgba(255,255,255,.07); --vidrio2:rgba(255,255,255,.03);
    --noche:#eef1ea; --chip:rgba(157,182,122,.14); --chip-t:#b9c9a0; --alerta:rgba(240,170,80,.14); --alerta-t:#f3c27c;
    --sombra:0 18px 40px -26px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:360px;height:760px;overflow:hidden}
  body{font:400 14px/1.4 "Inter Tight",system-ui,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased;
    background:radial-gradient(90% 40% at 85% 0%,rgba(157,182,122,.32),transparent 70%),radial-gradient(70% 40% at 0% 60%,rgba(185,201,160,.16),transparent 70%),linear-gradient(180deg,var(--fondo2),var(--fondo))}
  .oscuro body,body.oscuro{background:radial-gradient(90% 40% at 85% 0%,rgba(79,98,54,.38),transparent 70%),radial-gradient(70% 40% at 0% 70%,rgba(185,201,160,.1),transparent 70%),linear-gradient(180deg,var(--fondo2),var(--fondo))}
  .pantalla{position:relative;height:760px;padding:0 18px;display:flex;flex-direction:column;gap:14px}
  /* barra de estado como la de un teléfono real: hora, cámara frontal al centro, señal, wifi y batería con su nivel */
  .estado{position:relative;display:flex;justify-content:space-between;align-items:center;height:40px;padding:0 6px 0 10px;font-weight:600;font-size:13.5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .estado .camara{position:absolute;left:50%;top:9px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3a3f55 0,#0b0c10 55%);box-shadow:0 0 0 1.5px rgba(0,0,0,.85)}
  .estado .iconos{display:inline-flex;align-items:center;gap:6px}
  .estado svg{display:block;height:12px;width:auto}
  .estado .pct{font-size:12px;font-weight:600;margin-right:-1px}
  .vidrio{background:linear-gradient(135deg,var(--vidrio),var(--vidrio2));border-radius:24px;
    box-shadow:inset 0 0 0 1px var(--linea),inset 0 1px 0 rgba(255,255,255,.6),var(--sombra);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .oscuro .vidrio{box-shadow:inset 0 0 0 1px var(--linea),inset 0 1px 0 rgba(255,255,255,.08),var(--sombra)}
  .ceja{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
  h1{font-weight:600;font-size:30px;line-height:1;letter-spacing:-.045em}
  .circ{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none}
  .circ svg{width:15px;height:15px}
  .pildora{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;height:40px;padding:0 5px 0 14px;border-radius:999px;font-weight:600;font-size:13px}
  .pildora.principal{background:#1e2418;color:#f7f9f2;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 20px -12px rgba(0,0,0,.6)}
  .pildora.principal .circ{background:linear-gradient(135deg,#d6e2c2,#9db67a);color:#1f2914}
  .pildora.cristal{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
  .pildora.cristal .circ{background:rgba(255,255,255,.22);color:#fff}
  /* la próxima cita: placa de vidrio sobre esmeralda */
  .proxima{position:relative;overflow:hidden;border-radius:26px;padding:16px;color:#f2fbf7;
    background:radial-gradient(120% 90% at 100% 0%,rgba(214,226,194,.55),transparent 55%),linear-gradient(140deg,#5d7340,#3c4b28);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.6),0 24px 40px -24px rgba(60,75,40,.8)}
  .proxima::after{content:"";position:absolute;inset:-30% auto -30% 55%;width:30%;rotate:18deg;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
  .cuenta{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:11.5px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
  .cuenta::before{content:"";width:6px;height:6px;border-radius:50%;background:#e6efd7;box-shadow:0 0 8px #e6efd7}
  .proxima .hora{font-size:28px;font-weight:600;letter-spacing:-.04em;line-height:1;margin:12px 0 6px}
  .proxima .quien{font-weight:600;font-size:14px}
  .proxima .donde{opacity:.85;font-size:12.5px;margin:2px 0 14px}
  .fila{display:flex;gap:8px}
  .semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px}
  .dia{display:grid;justify-items:center;gap:3px;padding:8px 0 7px;border-radius:16px;font-size:11px;color:var(--suave)}
  .dia b{font-size:16px;font-weight:600;color:var(--tinta);letter-spacing:-.02em}
  .dia i{width:4px;height:4px;border-radius:50%;background:var(--esmeralda2)}
  .dia.hoy{background:#1e2418;color:#dbe5cc;box-shadow:0 10px 20px -12px rgba(0,0,0,.6)}
  .dia.hoy b{color:#fff}
  .oscuro .dia.hoy{background:linear-gradient(140deg,#5d7340,#3c4b28)}
  .titulo-lista{display:flex;justify-content:space-between;align-items:center}
  .titulo-lista h2{font-size:19px;font-weight:600;letter-spacing:-.03em}
  .seg{display:flex;padding:3px;border-radius:999px;font-size:12px;font-weight:600}
  .seg span{padding:6px 11px;border-radius:999px;color:var(--suave)}
  .seg span.si{background:var(--tinta);color:var(--fondo2)}
  .cita{display:flex;gap:12px;padding:13px 14px;align-items:flex-start}
  .cita .h{width:44px;flex:none;font-weight:600;font-size:15px;letter-spacing:-.02em;line-height:1.1}
  .cita .h small{display:block;font-weight:500;font-size:11px;color:var(--suave)}
  .cita .barra{width:3px;align-self:stretch;border-radius:3px;background:linear-gradient(180deg,var(--esmeralda2),var(--esmeralda))}
  .cita .barra.az{background:linear-gradient(180deg,#dfe8d0,#aec493)}
  .cita b{display:block;font-weight:600;font-size:14.5px;letter-spacing:-.015em}
  .chips{display:flex;gap:5px;margin:5px 0 4px}
  .chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--chip-t)}
  .chip.debe{background:var(--alerta);color:var(--alerta-t)}
  .lugar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--suave)}
  .lugar::before{content:"";width:6px;height:6px;rotate:45deg;background:linear-gradient(135deg,#fff,var(--esmeralda2));box-shadow:0 0 0 1px rgba(79,98,54,.45)}
  .oscuro .arriba .pildora.principal{background:#eef1ea;color:#0f120c}
  .menu{position:absolute;left:14px;right:14px;bottom:18px;height:62px;border-radius:999px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 6px}
  .menu span{display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--suave)}
  .menu svg{width:19px;height:19px}
  .menu span.si{color:var(--tinta)}
  .menu span.si svg{background:var(--chip);color:var(--esmeralda);border-radius:999px;padding:4px 12px;width:44px;height:27px;box-sizing:border-box}
  .oscuro .menu span.si svg{color:var(--esmeralda2)}
  /* detalle */
  .arriba{display:flex;justify-content:space-between}
  .boton-c{display:grid;place-items:center;width:42px;height:42px;border-radius:50%}
  .boton-c svg{width:18px;height:18px}
  .acciones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .accion{display:grid;justify-items:center;gap:6px;padding:12px 0 10px;font-size:11.5px;font-weight:600}
  .accion .circ{width:38px;height:38px;background:var(--chip);color:var(--esmeralda)}
  .accion .circ svg{width:17px;height:17px}
  .accion.wa .circ{background:linear-gradient(135deg,#d6e2c2,#9db67a);color:#1f2914}
  .interruptor{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:500}
  .interruptor+.interruptor{border-top:1px solid rgba(30,36,24,.07)}
  .tog{width:42px;height:25px;border-radius:999px;background:rgba(30,36,24,.12);position:relative;box-shadow:inset 0 0 0 1px rgba(30,36,24,.06)}
  .tog::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .tog.si{background:linear-gradient(135deg,#9db67a,#4f6236)}
  .tog.si::after{left:20px}
  .datos{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:14px 16px}
  .datos div{display:grid;gap:1px}
  .datos span{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--suave)}
  .datos b{font-weight:600;font-size:15px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .canciones{padding:14px 16px}
  .canciones h3{font-size:14px;font-weight:600;margin-bottom:8px}
  .canciones ul{list-style:none;padding:0;display:grid;gap:6px;font-size:13px}
  .canciones li{display:flex;gap:9px;align-items:center}
  .canciones li::before{content:"";width:7px;height:7px;rotate:45deg;background:linear-gradient(135deg,#fff,#9db67a);box-shadow:0 0 0 1px rgba(79,98,54,.5);flex:none}
</style>
</head>
<body>
<script>
  const p = new URLSearchParams(location.search).get('p') || 'claro';
  if (p === 'oscuro') document.documentElement.classList.add('oscuro');
  const I = {
    ruta:'<path d="M12 21s-6-5.3-6-10.5a6 6 0 0 1 12 0C18 15.7 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.2"/>',
    campana:'<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
    mas:'<path d="M12 5v14M5 12h14"/>',
    agenda:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    cal:'<rect x="3.5" y="4" width="17" height="16.5" rx="3"/><path d="M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/>',
    nota:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    gente:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
    cobro:'<rect x="2.5" y="6" width="19" height="12.5" rx="2.5"/><circle cx="12" cy="12.2" r="2.6"/>',
    atras:'<path d="M15 5l-7 7 7 7"/>', lapiz:'<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    tel:'<path d="M5 3.5h3.5l2 5-2.5 1.5a11 11 0 0 0 6 6l1.5-2.5 5 2V19a2 2 0 0 1-2 2A17 17 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>',
    wa:'<path d="M20 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20l1.2-3.7A8.5 8.5 0 1 1 20 11.5z"/>',
    reloj:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', flecha:'<path d="M5 12h14M13 6l6 6-6 6"/>'
  };
  const ic = (n, w = 1.9) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
  const hora = p === 'oscuro' ? '5:10' : '9:41';   // la hora cuadra con "tu próxima cita en..."
  const estado = `<div class="estado"><span>${hora}</span><span class="camara" aria-hidden="true"></span><span class="iconos">
    <svg viewBox="0 0 17 12" aria-hidden="true"><rect x="0" y="8.5" width="3" height="3.5" rx=".8" fill="currentColor"/><rect x="4.6" y="6" width="3" height="6" rx=".8" fill="currentColor"/><rect x="9.2" y="3" width="3" height="9" rx=".8" fill="currentColor"/><rect x="13.8" y="0" width="3" height="12" rx=".8" fill="currentColor" opacity=".3"/></svg>
    <svg viewBox="0 0 16 12" aria-hidden="true"><path d="M8 11.6 5.6 9.2a3.4 3.4 0 0 1 4.8 0z" fill="currentColor"/><path d="M3.7 7.3a6.1 6.1 0 0 1 8.6 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M1.2 4.6a9.6 9.6 0 0 1 13.6 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span class="pct">78%</span>
    <svg viewBox="0 0 26 12" aria-hidden="true"><rect x=".75" y=".75" width="21.5" height="10.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45"/><rect x="2.6" y="2.6" width="13.6" height="6.8" rx="1.6" fill="currentColor"/><path d="M23.8 4.2v3.6a1.9 1.9 0 0 0 0-3.6z" fill="currentColor" opacity=".45"/></svg>
  </span></div>`;
  const menu = `<nav class="menu vidrio">${[['agenda','Agenda',1],['cal','Calendario'],['nota','Música'],['gente','Clientes'],['cobro','Cobros']].map(([i,t,s])=>`<span class="${s?'si':''}">${ic(i)}${t}</span>`).join('')}</nav>`;
  const semana = (hoy) => `<div class="semana vidrio">${[['D',25],['L',26],['M',27],['M',28],['J',29],['V',30],['S',31]].map(([d,n],k)=>`<div class="dia ${n===hoy?'hoy':''}">${d}<b>${n}</b>${[0,2,4,6].includes(k)?'<i></i>':'<i style="opacity:0"></i>'}</div>`).join('')}</div>`;
  const cita = (h, m, quien, chips, lugar, az) => `<div class="cita vidrio"><div class="h">${h}<small>${m}</small></div><div class="barra ${az?'az':''}"></div><div><b>${quien}</b><div class="chips">${chips}</div><div class="lugar">${lugar}</div></div></div>`;
  let html;
  if (p === 'detalle') {
    html = `${estado}
    <div class="arriba"><span class="boton-c vidrio">${ic('atras',2)}</span><span class="boton-c vidrio">${ic('lapiz')}</span></div>
    <div><div class="ceja" style="color:var(--esmeralda)">Novena</div><h1 style="margin:6px 0 8px">doña Mari Pech</h1>
      <div style="font-weight:600;font-size:15px">Hoy · 3:00 de la tarde</div><div style="color:var(--suave);font-size:13px">Dura 1 h · termina 4:00 p. m.</div></div>
    <div class="acciones">${[['tel','Llamar'],['wa','WhatsApp','wa'],['ruta','Llegar'],['reloj','Mover']].map(([i,t,c])=>`<div class="accion vidrio ${c||''}"><span class="circ">${ic(i)}</span>${t}</div>`).join('')}</div>
    <div class="vidrio"><div class="interruptor">Ya se hizo<span class="tog"></span></div><div class="interruptor">Falta cobrar <b style="margin-left:auto;margin-right:12px;font-weight:600">$400</b><span class="tog si"></span></div></div>
    <div class="datos vidrio"><div><span>Colonia</span><b>Chuburná</b></div><div><span>Zona</span><b>Norte</b></div><div><span>Precio</span><b>$600</b></div><div><span>Anticipo</span><b>$200</b></div><div style="grid-column:1/-1"><span>Teléfono</span><b>999 123 4567</b></div></div>
    <div class="canciones vidrio"><h3>Canciones del evento</h3><ul><li>Bendito, bendito</li><li>Salve, oh Virgen</li><li>Mañanitas a la Virgen</li></ul></div>`;
  } else {
    const oscuro = p === 'oscuro';
    html = `${estado}
    <div class="arriba" style="align-items:flex-end"><div><div class="ceja">${oscuro ? 'Jueves 29 de octubre' : 'Sábado 31 de octubre'}</div><h1 style="margin-top:6px">${oscuro ? 'Buenas tardes,<br>Javier' : 'Buenos días,<br>Javier'}</h1></div>
      <span class="pildora principal" style="height:44px">Nueva<span class="circ" style="width:34px;height:34px">${ic('mas',2.2)}</span></span></div>
    <div class="proxima"><span class="cuenta">${oscuro ? 'Tu próxima cita · en 1 h 20 min' : 'Tu próxima cita · en 19 min'}</span>
      <div class="hora">${oscuro ? '6:30 de la tarde' : '10:00 de la mañana'}</div>
      <div class="quien">${oscuro ? 'Boda · familia Pech Uc' : 'Rezo · don Pedro Canché'}</div><div class="donde">${oscuro ? 'Hacienda Xcanatún, carretera a Progreso' : 'Calle 60 por 45, Centro'}</div>
      <div class="fila"><span class="pildora principal">Cómo llegar<span class="circ">${ic('ruta')}</span></span><span class="pildora cristal">Avisar<span class="circ">${ic('campana')}</span></span></div></div>
    ${semana(oscuro ? 29 : 31)}
    <div class="titulo-lista"><h2>${oscuro ? 'Jueves' : 'Hoy'}</h2><div class="seg vidrio"><span class="si">Por hora</span><span>Por zona</span></div></div>
    ${oscuro
      ? cita('6:30','p. m.','familia Pech Uc','<span class="chip">Boda</span><span class="chip debe">Falta $1,500</span>','Xcanatún') + cita('9:00','p. m.','Karla Euán','<span class="chip">XV años</span>','García Ginerés', true)
      : cita('10:00','a. m.','don Pedro Canché','<span class="chip">Rezo</span><span class="chip debe">Falta $300</span>','Centro') + cita('3:00','p. m.','doña Mari Pech','<span class="chip">Novena</span><span class="chip debe">Falta $400</span>','Chuburná', true)}
    ${menu}`;
  }
  document.body.innerHTML = `<div class="pantalla">${html}</div>`;
</script>
</body>
</html>
