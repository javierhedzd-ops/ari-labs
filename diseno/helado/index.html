<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muestra · helado 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Muestra del helado 3D para la heladería: al abrir, las bolas caen sobre el cono y rebotan;
     después gira despacio y sigue el dedo. Fondo rosa como la portada de la heladería. */
  :root{ --rosa:#d6336c; --rosa-osc:#9c1f4c; --tinta:#2c1820; color-scheme:light }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--rosa);color:#fff;font:500 1rem/1.4 "Inter Tight",system-ui,sans-serif;overflow:hidden}
  #escena{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
  .texto{position:fixed;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));display:grid;justify-items:center;gap:14px;text-align:center;pointer-events:none}
  .texto h1{margin:0;font:400 clamp(2.2rem,1.6rem + 3vw,3.6rem)/1 Caprasimo,serif}
  .gordo{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 24px;border:0;border-radius:999px;cursor:pointer;
    font:600 1rem/1 "Inter Tight",sans-serif;background:#fff;color:var(--rosa);box-shadow:0 5px 0 rgba(44,24,32,.25);transition:transform .15s,box-shadow .15s}
  .gordo:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(44,24,32,.25)}
  .gordo:focus-visible{outline:3px solid var(--tinta);outline-offset:3px}
</style>
</head>
<body>
<canvas id="escena" aria-label="Un cono de helado en 3D: dos bolas caen sobre el cono y rebotan."></canvas>
<div class="texto"><h1 id="sabor">Mamey y fresa</h1><button class="gordo" id="otra" type="button">Servir otra vez</button></div>
<script type="module">
  import * as THREE from '../../vendor/three/three.module.min.js';
  import { RoomEnvironment } from '../../vendor/three/RoomEnvironment.js';

  const lienzo = document.getElementById('escena');
  const render = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true, alpha: true });
  render.setPixelRatio(Math.min(devicePixelRatio, 2));
  render.toneMapping = THREE.ACESFilmicToneMapping; render.toneMappingExposure = 1.05;
  render.outputColorSpace = THREE.SRGBColorSpace;
  const escena = new THREE.Scene();
  escena.environment = new THREE.PMREMGenerator(render).fromScene(new RoomEnvironment(), 0.04).texture;
  const camara = new THREE.PerspectiveCamera(30, 1, 0.1, 100); camara.position.set(0, 0, 12);
  const luz = new THREE.DirectionalLight(0xffffff, 1.6); luz.position.set(3, 6, 5); escena.add(luz);
  const relleno = new THREE.DirectionalLight(0xfff0f4, 0.7); relleno.position.set(-1, -2, 6); escena.add(relleno);   // luz suave de frente y abajo: sin franja oscura bajo las bolas
  escena.add(new THREE.HemisphereLight(0xfff4f7, 0xf3b7c9, 0.75));   // luz de abajo rosada clara: sin sombras moradas debajo de las bolas

  // ---- el cono: barquillo color galleta con su cuadrícula ----
  const tex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    x.fillStyle = '#e9b872'; x.fillRect(0, 0, 256, 256);
    x.strokeStyle = 'rgba(140,85,30,.55)'; x.lineWidth = 9;
    for (let i = -256; i < 512; i += 42) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 256, 256); x.stroke(); x.beginPath(); x.moveTo(i + 256, 0); x.lineTo(i, 256); x.stroke(); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 2); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
  })();
  const perfil = [new THREE.Vector2(0.02, -2.6), new THREE.Vector2(0.86, 0), new THREE.Vector2(0.98, 0.08), new THREE.Vector2(0.98, 0.26), new THREE.Vector2(0.88, 0.3)];
  const cono = new THREE.Mesh(new THREE.LatheGeometry(perfil, 64), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.75, metalness: 0, side: THREE.DoubleSide }));
  const grupo = new THREE.Group(); grupo.add(cono); escena.add(grupo);

  // ---- las bolas: esfera cremosa con la orilla de abajo ondulada (donde se derrite un poco) ----
  function bola(color, r) {
    const g = new THREE.SphereGeometry(r, 96, 64), p = g.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const a = Math.atan2(v.z, v.x), y = v.y / r;
      let k = 1 + Math.sin(v.x * 5.1 + v.y * 3.7) * Math.sin(v.z * 4.3) * 0.025;                       // cremosa, no perfecta
      if (y < -0.15) k *= 1 + (Math.sin(a * 9) * 0.5 + 0.5) * 0.12 * Math.min(1, (-0.15 - y) * 3);       // olanes de la orilla
      v.multiplyScalar(k);
      if (v.y < -r * 0.55) v.y = -r * 0.55 + (v.y + r * 0.55) * 0.25;                                   // base aplastada
      p.setXYZ(i, v.x, v.y, v.z);
    }
    g.computeVertexNormals();
    const m = new THREE.MeshPhysicalMaterial({ color, roughness: 0.42, sheen: 1, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xffffff), clearcoat: 0.35, clearcoatRoughness: 0.4 });
    return new THREE.Mesh(g, m);
  }
  const sabores = [['Mamey y fresa', 0xf4a08a, 0xe2557f], ['Coco y chocolate', 0xfaf6ee, 0x6b3b2a], ['Elote y maracuyá', 0xf3d27a, 0xf2b84b], ['Guanábana y fresa', 0xf3efe3, 0xe2557f]];
  let cual = 0;
  const b1 = bola(sabores[0][1], 1.02), b2 = bola(sabores[0][2], 0.86);
  grupo.add(b1, b2);
  // chispitas encima de la bola de arriba
  const chispas = new THREE.Group(); b2.add(chispas);
  const colChispa = [0xffffff, 0xffb3cc, 0xe9b872, 0x9c1f4c];
  for (let i = 0; i < 26; i++) {
    const c = new THREE.Mesh(new THREE.CapsuleGeometry(0.034, 0.16, 4, 8), new THREE.MeshStandardMaterial({ color: colChispa[i % 4], roughness: 0.5 }));
    const th = Math.random() * Math.PI * 2, ph = Math.random() * 0.9;
    const d = new THREE.Vector3(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th)).multiplyScalar(0.87);
    c.position.copy(d); c.lookAt(d.clone().multiplyScalar(2)); c.rotateX(Math.PI / 2); c.rotateZ(Math.random() * Math.PI);
    chispas.add(c);
  }
  // dónde termina cada bola (apoyada en el cono o en la otra bola)
  const meta1 = 0.62, meta2 = 1.98;
  const caida = [{ m: b1, meta: meta1, y: 6, v: 0, retraso: 0.25, squash: 0, quieta: false }, { m: b2, meta: meta2, y: 7, v: 0, retraso: 0.85, squash: 0, quieta: false }];
  function servir() {
    caida.forEach(c => { c.y = c.meta + 6; c.v = 0; c.squash = 0; c.quieta = false; c.t = 0; });
    reloj.start();
  }
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const reloj = new THREE.Clock();
  if (quieto) caida.forEach(c => { c.y = c.meta; c.quieta = true; });

  document.getElementById('otra').addEventListener('click', () => {
    cual = (cual + 1) % sabores.length;
    b1.material.color.setHex(sabores[cual][1]); b2.material.color.setHex(sabores[cual][2]);
    document.getElementById('sabor').textContent = sabores[cual][0];
    if (!quieto) servir();
  });

  function medir() {
    render.setSize(innerWidth, innerHeight, false); camara.aspect = innerWidth / innerHeight;
    // el helado (de la punta del cono a las chispitas mide ~5.6) cabe en el espacio libre arriba del título
    const arriba = 28, abajo = document.querySelector('.texto').getBoundingClientRect().top - 28;
    const fraccion = Math.max(0.3, (abajo - arriba) / innerHeight);
    let altoVista = 5.9 / fraccion;
    const anchoVista = altoVista * camara.aspect; if (anchoVista < 3.6) altoVista = 3.6 / camara.aspect;   // que tampoco se salga de lado
    camara.position.z = altoVista / (2 * Math.tan(THREE.MathUtils.degToRad(camara.fov / 2)));
    camara.updateProjectionMatrix();
    const centroPx = (arriba + abajo) / 2;
    centroY = (0.5 - centroPx / innerHeight) * altoVista - 0.15;   // 0.15: el centro del helado está un poco arriba de su origen
  }
  let centroY = 0;
  medir(); addEventListener('resize', medir); document.fonts && document.fonts.ready.then(medir);
  let px = 0, py = 0, tx = 0, ty = 0; const incl = new THREE.Vector2(), vel = new THREE.Vector2();
  addEventListener('pointermove', e => { tx = e.clientX / innerWidth - 0.5; ty = e.clientY / innerHeight - 0.5; }, { passive: true });

  let antes = 0;
  render.setAnimationLoop(() => {
    const t = reloj.getElapsedTime(), dt = Math.min(0.033, Math.max(0.001, t - antes)); antes = t;
    // caída con gravedad; al tocar rebota menos cada vez y se aplasta un poquito (como algo cremoso)
    caida.forEach(c => {
      if (c.quieta || t < c.retraso) { c.m.position.y = c.y; c.m.visible = t >= c.retraso || quieto; return; }
      c.m.visible = true;
      c.v -= 26 * dt; c.y += c.v * dt;
      if (c.y <= c.meta) {
        c.y = c.meta;
        if (Math.abs(c.v) > 1.2) { c.squash = Math.min(0.28, Math.abs(c.v) * 0.022); c.v = -c.v * 0.32; } else { c.v = 0; c.quieta = true; }
      }
      c.squash *= Math.pow(0.86, dt * 60);
      c.m.position.y = c.y;
      c.m.scale.set(1 + c.squash * 0.6, 1 - c.squash, 1 + c.squash * 0.6);
    });
    // la bola de arriba se apoya en la de abajo: si la de abajo se aplasta, baja con ella
    if (caida[0].quieta === false && caida[1].quieta) b2.position.y = meta2 - (1 - b1.scale.y) * 1.02;
    // gira despacio y sigue el dedo con un resorte
    px += (tx - px) * 0.06; py += (ty - py) * 0.06;
    vel.x += (py * 0.5 - incl.x) * 0.03; vel.y += (px * 0.9 - incl.y) * 0.03; vel.multiplyScalar(0.88); incl.add(vel);
    grupo.rotation.set(0.12 + incl.x, (quieto ? 0.4 : t * 0.35) + incl.y, Math.sin(t * 0.7) * 0.03);
    grupo.position.y = centroY + (quieto ? 0 : Math.sin(t * 1.1) * 0.06);   // el helado arriba del título, sin tocarlo
    render.render(escena, camara);
  });
</script>
</body>
</html>
